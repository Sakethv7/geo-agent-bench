[project]
name = "geobench"
version = "0.1.0"
description = "Measure how AI agents and crawlers behave on sites we own"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx",
    "numpy",
    "pandas",
    "pyyaml",
    "starlette",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
geobench = "geobench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geobench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
