# Raw fetch arm on the large site (ADR-028, open question 7): Claude with our own fetch tool, signed with our bot key,
# so the geo-l interceptor treats it as a verified agent. 4 deep tasks, 3 repeats, two variants. 24 runs.
plan_id: large-raw
domain: wanderingcodersv.dev
scheme: https
host_mode: per_run
variants: [legacy-l, geo-l]
agent_names: [claude-raw]
tasks: [tl01, tl03, tl05, tl06]
reps: 3
order_seed: 20261104
quiet_gap_seconds: 35
budget: {max_requests: 60, max_seconds: 600}
pull_cmd: "gcloud compute scp instance-20261102-203604:/srv/geobench/runs/requests.jsonl runs/requests.jsonl --zone=us-central1-c --quiet"   # no shell: split on spaces
agents:
  claude-raw:
    kind: claude_tools
    model: claude-sonnet-5-5
    obey_robots: false
    signing: signed
    signature_agent: https://bot.wanderingcodersv.dev/
