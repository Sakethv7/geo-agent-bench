# Portfolio Phase A plan (ADR-015 amendment, 2026-11-03).
# Write results only to runs/portfolio-phase-a-runs.jsonl. Do not reuse the
# aborted runs/phase-a-runs.jsonl file because run ids encode plan membership.
plan_id: portfolio-phase-a
domain: wanderingcodersv.dev
scheme: https
host_mode: per_run
variants: [legacy, ai]
agent_names: [claude-vendor, claude-raw, qwen-llamacpp]
tasks: [t01, t02, t03, t04, t05, t06]
reps: 1
order_seed: 20261102
quiet_gap_seconds: 35
budget: {max_requests: 40, max_seconds: 600}
pull_cmd: "gcloud compute scp $GEOBENCH_VM:/srv/geobench/runs/requests.jsonl runs/requests.jsonl --zone=us-central1-c --quiet"
agents:
  claude-vendor:
    kind: claude
    model: claude-sonnet-5-5
  claude-raw:
    kind: claude_tools
    model: claude-sonnet-5-5
    obey_robots: false
  qwen-llamacpp:
    kind: openai_compat
    base_url: http://localhost:8080/v1
    model: qwen3-8b-q4_k_m
    model_file: Qwen3-8B-Q4_K_M.gguf (Qwen/Qwen3-8B-GGUF, sha256 d98cdcbd03e17ce47681435b5150e34c1417f50b5c0019dd560e4882c5745785)
    runtime: llama.cpp
    server_args: "-m ~/models/Qwen3-8B-Q4_K_M.gguf --alias qwen3-8b-q4_k_m -c 32768 --cache-type-k q8_0 --cache-type-v q8_0 --jinja --port 8080"
    temperature: 0.7
    obey_robots: false
