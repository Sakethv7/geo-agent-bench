<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Decision map: 24 ADRs and the three that reversed an earlier one" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/></marker></defs>
<rect width="1000" height="560" rx="12" fill="#12161f"/>
<text x="24" y="34" fill="#e8ebf2" font-size="18" font-weight="600">Decision map: 24 ADRs and the three that reversed an earlier one</text>
<text x="24" y="56" fill="#9aa4b8" font-size="12">Each box is a group of decisions. Arrows show where evidence changed the plan.</text>
<rect x="24" y="100" width="220" height="80" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="134" y="125" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ADR-001 to 008</text><text x="134" y="140" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">Tier, agents, subdomains, log,</text><text x="134" y="155" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">scoring, interceptor, VM, domain</text>
<rect x="24" y="230" width="220" height="80" rx="6" fill="#78350f" stroke="#fcd34d" stroke-width="1.5"/><text x="134" y="255" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ADR-009</text><text x="134" y="270" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">One host name per run</text><text x="134" y="285" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">(Claude&#x27;s fetch tool caches)</text>
<rect x="24" y="360" width="220" height="80" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="134" y="385" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ADR-010</text><text x="134" y="400" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">Pilot uses cloud agents only</text><text x="134" y="415" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">(Qwen dropped)</text>
<rect x="270" y="100" width="220" height="80" rx="6" fill="#2a3140" stroke="#7c869a" stroke-width="1.5"/><text x="380" y="125" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ADR-011</text><text x="380" y="140" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ai variant: llms.txt,</text><text x="380" y="155" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">markdown twins, head link</text>
<rect x="270" y="230" width="220" height="80" rx="6" fill="#78350f" stroke="#fcd34d" stroke-width="1.5"/><text x="380" y="255" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ADR-012</text><text x="380" y="270" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">Pointers move into the page text</text><text x="380" y="285" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">(the fetch tool drops the head)</text>
<rect x="270" y="360" width="220" height="80" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="380" y="385" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ADR-013 to 017</text><text x="380" y="400" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">Phase A: heavy pages, planted files,</text><text x="380" y="415" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">three agent arms, stranger report</text>
<rect x="516" y="360" width="220" height="80" rx="6" fill="#78350f" stroke="#fcd34d" stroke-width="1.5"/><text x="626" y="385" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ADR-015</text><text x="626" y="400" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">Qwen comes back on llama.cpp</text><text x="626" y="415" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">(amends ADR-010)</text>
<rect x="516" y="100" width="220" height="80" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="626" y="125" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ADR-018 to 020</text><text x="626" y="140" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">Phase B: MCP server,</text><text x="626" y="155" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">minimal and broad tools, poison</text>
<rect x="516" y="230" width="220" height="80" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="626" y="255" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ADR-021 to 023</text><text x="626" y="270" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">Phase C: signatures, OAuth,</text><text x="626" y="285" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">identity matrix</text>
<rect x="762" y="230" width="220" height="80" rx="6" fill="#1e3a8a" stroke="#93c5fd" stroke-width="1.5"/><text x="872" y="255" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">ADR-024</text><text x="872" y="270" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">Retry once on an empty reply</text><text x="872" y="285" fill="#e8ebf2" font-size="11" text-anchor="middle" dominant-baseline="central">(new arm, same seeds)</text>
<path d="M134,180 V230" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="142" y="208" fill="#9aa4b8" font-size="11">cache found</text>
<path d="M134,310 V360" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M244,400 H270" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M380,180 V230" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="388" y="208" fill="#9aa4b8" font-size="11">head invisible</text>
<path d="M380,310 V360" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M490,400 H516" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/><text x="464" y="392" fill="#9aa4b8" font-size="11">reverses</text>
<path d="M626,360 V310" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M626,230 V180" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M736,270 H762" fill="none" stroke="#8a94a6" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="24" y="520" width="14" height="14" rx="3" fill="#2a3140" stroke="#7c869a"/><text x="44" y="531" fill="#9aa4b8" font-size="11">plain decision</text><rect x="174" y="520" width="14" height="14" rx="3" fill="#78350f" stroke="#fcd34d"/><text x="194" y="531" fill="#9aa4b8" font-size="11">forced by evidence</text><rect x="324" y="520" width="14" height="14" rx="3" fill="#1e3a8a" stroke="#93c5fd"/><text x="344" y="531" fill="#9aa4b8" font-size="11">phase work</text>
</svg>
